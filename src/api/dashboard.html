<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaps</title>
<link rel="stylesheet" href="/ui/app.css">
<script src="/ui/app.js"></script>
</head>
<body>

<header class="bar">
  <span class="brand"><span class="dot"></span>Internal Brain <small>Aurelia</small></span>
  <nav>
    <a href="/">Ask</a>
    <a href="/dashboard" data-officer="1" aria-current="page">Gaps</a>
    <a href="/audit" data-officer="1">Audit</a>
    <a href="/sources" data-officer="1">Sources</a>
  </nav>
  <span class="spacer"></span>
  <button class="icon-button" id="theme" type="button" aria-label="Switch theme" title="Switch theme">◐</button>
</header>

<main class="page wide">
  <h1>Gaps</h1>
  <p class="lede">Two halves of the same question, counted from the same audit log.</p>

  <div class="panel">
    <div class="controls">
      <div role="tablist" aria-label="Report" style="display:flex;gap:6px">
        <button class="ghost" id="tab-access" role="tab" aria-selected="true" type="button">Access gaps</button>
        <button class="ghost" id="tab-knowledge" role="tab" aria-selected="false" type="button">Knowledge gaps</button>
      </div>
      <div>
        <label class="label" for="days">Days</label>
        <input id="days" type="number" min="1" value="7" inputmode="numeric">
      </div>
      <button id="go" type="button">Refresh</button>
      <div class="spacer" style="margin-left:auto"></div>
      <div class="readout" id="scanned" hidden>
        <span class="big" id="scanned-n">0</span><span class="unit">refusals scanned</span>
      </div>
    </div>
    <p class="lede" id="blurb" style="margin:16px 0 0;font-size:14px"></p>
  </div>

  <section class="result" id="out" aria-live="polite"></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
// Nothing below runs until somebody is signed in.
if (!IB.start()) { throw new Error("signed out"); }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));


const VIEWS = {
  access: {
    path: "/access-gaps",
    blurb: "The answer <b>exists, behind a wall</b> — so fix the grant. Ranked by how many "
         + "<em>different</em> people hit it: one person retrying is a bad afternoon, six "
         + "across four teams is a permission model that does not match the org.",
    columns: [
      { key: "askers", head: "People", sortable: true },
      { key: "doc", head: "Document" },
      { key: "requests", head: "Requests", sortable: true },
      { key: "queries", head: "What they asked" },
    ],
    empty: "Nobody was turned away from a document in this window.",
  },
  knowledge: {
    path: "/knowledge-gaps",
    blurb: "The answer <b>does not exist</b> — so write the page. Refusals for lack of evidence, "
         + "clustered by meaning. Permission refusals are deliberately excluded: listing those "
         + "topics would turn this report into a map of what restricted material exists.",
    columns: [
      { key: "count", head: "Asks", sortable: true },
      { key: "topic", head: "Missing topic" },
      { key: "queries", head: "What they asked" },
    ],
    empty: "Nothing was asked that the corpus could not answer.",
  },
};

let view = "access";
let rows = [];
let sortKey = null;
let expanded = new Set();

const countCell = (n, word, max) => `
  <div class="count">
    <span class="n">${n}</span>
    <span class="of">${word}</span>
    <div class="meter" style="width:${Math.max(6, Math.round((n / max) * 100))}%"></div>
  </div>`;

function queriesCell(list, key) {
  const open = expanded.has(key);
  const shown = open ? list : list.slice(0, 2);
  const more = list.length - shown.length;
  return `<ul class="queries">${shown.map((q) => `<li>${esc(q)}</li>`).join("")}</ul>` +
    (more > 0 || open
      ? `<button class="row-toggle" type="button" data-key="${esc(key)}"
           style="margin-top:6px;font:500 12px var(--mono);color:var(--accent)">
           ${open ? "Show less" : `+${more} more`}</button>`
      : "");
}

function render() {
  const config = VIEWS[view];
  if (!rows.length) return `<div class="note">${config.empty}</div>`;

  const sorted = sortKey ? [...rows].sort((a, b) => b[sortKey] - a[sortKey]) : rows;
  const primary = view === "access" ? "askers" : "count";
  const max = Math.max(...rows.map((r) => r[primary]), 1);

  const body = sorted.map((r) => {
    const key = view === "access" ? `${r.source_platform}:${r.source_ref}` : r.topic;
    const queries = view === "access" ? r.example_queries : r.example_queries;
    if (view === "access") {
      return `<tr>
        <td>${countCell(r.askers, "askers", max)}</td>
        <td>
          <div class="ref"><span class="plat">${esc(r.source_platform)}:</span>${esc(r.source_ref)}</div>
          <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">
            ${r.sensitivity ? `<span class="tag restricted">${esc(r.sensitivity)}</span>` : ""}
            ${r.signals.map((s) => `<span class="tag neutral">${esc(s)}</span>`).join("")}
          </div>
        </td>
        <td class="count" style="font-size:15px">${r.requests}</td>
        <td>${queriesCell(queries, key)}</td>
      </tr>`;
    }
    return `<tr>
      <td>${countCell(r.count, "asks", max)}</td>
      <td>
        <div style="font-weight:500;font-size:16px">${esc(r.topic)}</div>
        <div style="margin-top:8px"><span class="tag neutral">no document covers this</span></div>
      </td>
      <td>${queriesCell(queries, key)}</td>
    </tr>`;
  }).join("");

  const head = config.columns.map((c) =>
    c.sortable
      ? `<th class="sortable" data-sort="${c.key}"
           ${sortKey === c.key ? 'aria-sort="descending"' : ""}>${c.head} ↓</th>`
      : `<th>${c.head}</th>`).join("");

  return `<div class="table-wrap"><table>
      <thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

async function load() {
  const config = VIEWS[view];
  $("out").innerHTML = `<div class="note">Loading${
    view === "knowledge" ? ". Clustering refusals and naming each topic takes a few seconds." : "…"}</div>`;
  $("scanned").hidden = true;

  let response;
  try {
    response = await IB.api(`${config.path}?days=${encodeURIComponent($("days").value)}`,
      {});
  } catch (error) {
    $("out").innerHTML = `<div class="note alert"><b>Cannot reach the API.</b>
      Start the server with <code>uvicorn src.api.main:app --port 8000</code>.
      ${esc(error.message)}</div>`;
    return;
  }

  if (response.status === 403) {
    // Refusing is the product, not an error to hide.
    rows = [];
    $("out").innerHTML = `<div class="note alert"><b>This page is for a compliance officer.</b> These reports are built from what people were refused, and the access-gap half names restricted documents and who wanted them. You are signed in as user ${esc(IB.active())}, who is not one —
  use <b>Add identity</b> in the header to sign in as
  <code>marcus.lim@aurelia.example</code> (password <code>demo</code>).</div>`;
    return;
  }
  if (!response.ok) {
    const detail = (await response.json().catch(() => ({}))).detail || "";
    $("out").innerHTML = `<div class="note alert"><b>HTTP ${response.status}.</b> ${esc(detail)}</div>`;
    return;
  }

  const report = await response.json();
  rows = report.gaps;
  expanded = new Set();
  sortKey = null;
  $("scanned-n").textContent = report.refusals_scanned;
  $("scanned").hidden = false;
  $("out").innerHTML = render() +
    `<p class="foot">Since ${esc(new Date(report.since).toLocaleString())}.</p>`;
}

function select(next) {
  view = next;
  $("blurb").innerHTML = VIEWS[next].blurb;
  for (const name of Object.keys(VIEWS)) {
    $(`tab-${name}`).setAttribute("aria-selected", String(name === next));
  }
  load();
}

$("out").addEventListener("click", (e) => {
  const sort = e.target.closest("th.sortable");
  if (sort) {
    sortKey = sort.dataset.sort;
    $("out").innerHTML = render() + ($("out").querySelector(".foot")?.outerHTML || "");
    return;
  }
  const toggle = e.target.closest(".row-toggle");
  if (toggle) {
    const key = toggle.dataset.key;
    expanded.has(key) ? expanded.delete(key) : expanded.add(key);
    const foot = $("out").querySelector(".foot")?.outerHTML || "";
    $("out").innerHTML = render() + foot;
  }
});

for (const name of Object.keys(VIEWS)) {
  $(`tab-${name}`).addEventListener("click", () => select(name));
}
$("go").addEventListener("click", load);
for (const id of ["days"]) {
  $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });
}
select("access");
</script>
</body>
</html>
