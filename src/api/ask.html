<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internal Brain</title>
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>

<header class="bar">
  <span class="brand"><span class="dot"></span>Internal Brain <small>Aurelia</small></span>
  <nav>
    <a href="/" aria-current="page">Ask</a>
    <a href="/dashboard">Compliance</a>
  </nav>
  <span class="spacer"></span>
  <button class="icon-button" id="theme" type="button" aria-label="Switch theme" title="Switch theme">◐</button>
</header>

<main class="page">
  <h1>Ask across every source at once</h1>
  <p class="lede">Confluence, Jira, Slack and Drive. You only ever see what your own
    permissions allow — the filter runs in the database, before any of it reaches the model.</p>

  <form class="panel" id="form">
    <div class="grow">
      <label class="label" for="q">Question</label>
      <textarea id="q" name="q" spellcheck="false"
        placeholder="How long do customers have to contest a chargeback?"></textarea>
    </div>

    <div class="controls" style="margin-top:14px">
      <div>
        <label class="label" for="uid">Asking as</label>
        <input id="uid" name="uid" type="number" min="1" value="1" inputmode="numeric">
      </div>
      <button id="go" type="submit">Ask</button>
      <div class="spacer" style="margin-left:auto"></div>
      <div class="readout" id="clock" hidden>
        <span class="big" id="elapsed">0.00</span><span class="unit">seconds</span>
      </div>
    </div>

    <div class="chips" id="chips"></div>
  </form>

  <section class="result" id="out" aria-live="polite"></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* --- theme ---------------------------------------------------------------- */
try {
  const saved = localStorage.getItem("ib-theme");
  if (saved) document.documentElement.dataset.theme = saved;
} catch (_) {}
$("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme
    ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("ib-theme", root.dataset.theme); } catch (_) {}
});

/* --- demo questions -------------------------------------------------------
   Ids rather than names on purpose: the page never enumerates who exists.
   The middle pair is the whole demo — same question, two callers.          */
const SAMPLES = [
  [1, "How long do customers have to contest a chargeback?"],
  [1, "What triggers an AML escalation review?"],
  [2, "What triggers an AML escalation review?"],
  [1, "How many transactions were flagged for AML in August?"],
  [1, "What is our parental leave policy?"],
];
$("chips").innerHTML = SAMPLES.map(([uid, q], i) =>
  `<button class="chip" type="button" data-i="${i}"><b>${uid}</b> &nbsp;${esc(q)}</button>`).join("");
$("chips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  const [uid, q] = SAMPLES[chip.dataset.i];
  $("uid").value = uid;
  $("q").value = q;
  ask();
});

/* --- asking --------------------------------------------------------------- */
const REFUSAL = "I don't have an answer you're permitted";
let ticking = null;

function startClock() {
  const began = performance.now();
  $("clock").hidden = false;
  $("elapsed").textContent = "0.00";
  ticking = setInterval(() => {
    $("elapsed").textContent = ((performance.now() - began) / 1000).toFixed(2);
  }, 60);
  return () => {
    clearInterval(ticking);
    const seconds = (performance.now() - began) / 1000;
    $("elapsed").textContent = seconds.toFixed(2);
    return seconds;
  };
}

function renderAnswer(reply, seconds) {
  const withheld = reply.text.startsWith(REFUSAL);
  const sources = reply.citations.length ? `
    <div class="sources">
      <span class="label">Sources</span>
      ${reply.citations.map((c) => `
        <div class="source">
          <span class="ref"><span class="plat">${esc(c.source_platform)}:</span>${esc(c.source_ref)}</span>
          <span class="title">${esc(c.title)}</span>
          <button class="copy" type="button" data-ref="${esc(c.source_platform)}:${esc(c.source_ref)}">Copy</button>
        </div>`).join("")}
    </div>` : "";

  // Timing is content here, not chrome: a refusal held to the deadline is the
  // property that stops the clock from saying what the words won't. Claim it only
  // when the clock agrees — a refusal that ran long escaped, and saying otherwise
  // next to a number that contradicts it discredits the whole guarantee. The upper
  // bound allows for the browser round-trip on top of the server's own padding.
  let held = "";
  if (withheld && seconds >= 3.9 && seconds <= 4.6) {
    held = `<div class="note"><b>Held to the 4.0s deadline.</b> Every refusal takes the same
      time whatever caused it, so timing this answer tells you nothing the sentence doesn't.
      Unpadded, a permission refusal returns in about 0.9s and an unanswerable one in 4.3s —
      enough to map what restricted material exists without ever seeing it.</div>`;
  } else if (withheld && seconds > 4.6) {
    held = `<div class="note"><b>This refusal ran past the 4.0s deadline.</b> Padding holds a
      refusal until the deadline but cannot pull it back, so a slow one leaks in that single
      direction. <code>evals/refusal_timing.py</code> measures how often: 0% on an idle
      machine. A cold model load or a loaded laptop is the usual cause.</div>`;
  }

  const why = withheld
    ? `<div class="note alert">Every refusal is this same sentence, whether the answer was
         restricted, unsupported or simply missing. The specific reason <b>was</b> recorded,
         and only a compliance officer can read it back — via <code>GET /audit/{request_id}</code>
         or the <a href="/dashboard">gaps dashboard</a>.</div>`
    : "";

  return `<div class="answer ${withheld ? "withheld" : ""}">${esc(reply.text)}${sources}</div>${held}${why}`;
}

async function ask() {
  const uid = Number($("uid").value);
  const query = $("q").value.trim();
  if (!query) { $("q").focus(); return; }

  $("go").disabled = true;
  $("out").innerHTML = `<div class="answer pending">Working. A refusal is held to a fixed
    deadline, so its timing cannot reveal why it was refused.</div>`;
  const stop = startClock();

  let response;
  try {
    response = await fetch("/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: uid, query }),
    });
  } catch (error) {
    stop();
    $("go").disabled = false;
    $("out").innerHTML = `<div class="note alert"><b>Cannot reach the API.</b>
      Start the server with <code>uvicorn src.api.main:app --port 8000</code>.
      ${esc(error.message)}</div>`;
    return;
  }

  const seconds = stop();
  $("go").disabled = false;

  if (!response.ok) {
    const detail = (await response.json().catch(() => ({}))).detail || "";
    $("out").innerHTML = `<div class="note alert"><b>HTTP ${response.status}.</b>
      ${esc(detail) || "The request was rejected."}</div>`;
    return;
  }
  $("out").innerHTML = renderAnswer(await response.json(), seconds);
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); ask(); });
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); ask(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
});
$("out").addEventListener("click", async (e) => {
  const button = e.target.closest(".copy");
  if (!button) return;
  try {
    await navigator.clipboard.writeText(button.dataset.ref);
    button.textContent = "Copied";
    setTimeout(() => { button.textContent = "Copy"; }, 1400);
  } catch (_) {
    const range = document.createRange();
    range.selectNodeContents(button.closest(".source").querySelector(".ref"));
    getSelection().removeAllRanges();
    getSelection().addRange(range);
  }
});
</script>
</body>
</html>
