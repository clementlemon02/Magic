<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internal Brain</title>
<link rel="stylesheet" href="/ui/app.css">
<script src="/ui/app.js"></script>
</head>
<body>

<header class="bar">
  <span class="brand"><span class="dot"></span>Internal Brain <small>Aurelia</small></span>
  <nav>
    <a href="/" aria-current="page">Ask</a>
    <a href="/dashboard" data-officer="1">Gaps</a>
    <a href="/audit" data-officer="1">Audit</a>
    <a href="/sources" data-officer="1">Sources</a>
  </nav>
  <span class="spacer"></span>
  <button class="icon-button" id="theme" type="button" aria-label="Switch theme" title="Switch theme">◐</button>
</header>

<main class="page">
  <h1>Ask</h1>
  <p class="lede">Confluence, Jira, Slack and Drive, in one question. You only ever see
    what your own permissions allow — the filter runs in the database, before any of it
    reaches the model.</p>

  <div class="thread" id="thread" aria-live="polite"></div>

  <div class="composer">
    <form class="panel" id="form">
      <textarea id="q" name="q" rows="2" spellcheck="false"
        placeholder="Ask anything — try &quot;What triggers an AML escalation review?&quot;"></textarea>
      <div class="controls">
        <div class="mode" role="tablist" aria-label="Who asks">
          <button id="mode-one" type="button" role="tab" aria-selected="true">One caller</button>
          <button id="mode-two" type="button" role="tab" aria-selected="false">Side by side</button>
        </div>
        <span class="asking" id="asking"></span>
        <button id="go" type="submit">Ask</button>
        <div class="readout" id="clock" hidden>
          <span class="big" id="elapsed">0.00</span><span class="unit">seconds</span>
        </div>
      </div>
      <div class="chips" id="chips"></div>
    </form>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
// Nothing below runs until somebody is signed in.
if (!IB.start()) { throw new Error("signed out"); }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* --- theme ---------------------------------------------------------------- */

/* --- demo questions -------------------------------------------------------
   Ids rather than names on purpose: the page never enumerates who exists.
   The middle pair is the whole demo — same question, two callers.          */
// One entry per question. The AML one used to appear twice, once per caller — the
// caller is whoever is signed in now, so the pair read as a duplicate. Side by side
// is how you ask it as two people.
const SAMPLES = [
  "How long do customers have to contest a chargeback?",
  "What triggers an AML escalation review?",
  "How many transactions were flagged for AML in August?",
  "What is our parental leave policy?",
];
$("chips").innerHTML = SAMPLES.map((q, i) =>
  `<button class="chip" type="button" data-i="${i}">${esc(q)}</button>`).join("");
$("chips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  $("q").value = SAMPLES[chip.dataset.i];
  ask();
});

/* --- the pipeline ----------------------------------------------------------
   The stages the graph can run, in order. While a question is in flight they are
   shown as pending, because the outcome is not known yet; once the response lands
   its own trace fills in what actually ran and how long each took.

   Not streamed, deliberately. A stage arriving live would let anyone reconstruct
   why a refusal happened from the shape alone — a permission conflict stops at
   retrieval on hop 1, an unsupported answer grinds through three — which is exactly
   what the constant-time refusal exists to hide. Replaying after the response
   leaves the clock outside unchanged. */
/* Every agent in the graph, in the order a request meets them. The ones a given
   request did not use are shown too, greyed: "our agents" is the point, and a list
   that only ever shows four of them never says what the other four are for. */
const AGENTS = [
  ["router",       "Router",        "picks the handler"],
  ["retrieval",    "Retrieval",     "ACL-filtered vector search"],
  ["sql_tool",     "SQL Tool",      "templated query, no model-written SQL"],
  ["clarification","Clarification", "asks one question back"],
  ["synthesizer",  "Synthesizer",   "drafts from permitted evidence"],
  ["verifier",     "Verifier",      "judges every claim"],
  ["escalation",   "Escalation",    "refuses, generically"],
  ["answer",       "Answer",        "assembles the reply"],
];
const LABEL = new Map(AGENTS.map(([k, name, blurb]) => [k, { name, blurb }]));

/* A waterfall rather than a row of pills: the bar widths are the measured times, so
   where a request actually spends itself is visible rather than stated. Replayed
   from the response's own trace and never streamed — a stage arriving live would let
   anyone reconstruct why a refusal happened from its shape, which is what the
   constant-time refusal exists to hide. */
// The longest bar stops here, leaving the rest of the lane for its label. Scaled in
// the width rather than capped with max-width: capping would squash every bar above
// the cap onto the same length and quietly break the proportions the chart is for.
// 72% because the side-by-side columns are half width, where "grounded 1.00" was
// clipping to "g".
const BAR_SPAN = 72;

function waterfall(trace, seconds) {
  const ran = new Map();
  for (const s of trace) {
    const prior = ran.get(s.node);
    // A node that looped is one row carrying the total and the count, not four rows
    // that each look like the whole of retrieval.
    ran.set(s.node, prior
      ? { ...prior, ms: prior.ms + s.ms, times: prior.times + 1, detail: s.detail || prior.detail }
      : { ms: s.ms, times: 1, detail: s.detail });
  }
  const worked = [...ran.values()].reduce((a, s) => a + s.ms, 0);
  const widest = Math.max(...[...ran.values()].map((s) => s.ms), 1);
  const idle = seconds === null ? null : seconds * 1000 - worked;

  const rows = AGENTS.map(([key, name, blurb]) => {
    const s = ran.get(key);
    if (!s) {
      return `<div class="lane off" title="${esc(blurb)}">
        <span class="who">${esc(name)}</span>
        <span class="span"></span><span class="ms">not used</span></div>`;
    }
    return `<div class="lane" title="${esc(blurb)}">
      <span class="who">${esc(name)}${s.times > 1 ? ` <b>×${s.times}</b>` : ""}</span>
      <span class="span"><i style="width:${Math.max((s.ms / widest) * BAR_SPAN, 1.5)}%"></i>
        ${s.detail ? `<em>${esc(s.detail)}</em>` : ""}</span>
      <span class="ms">${Math.round(s.ms)}ms</span></div>`;
  }).join("");

  // Everything outside the nodes: HTTP, auth, the cache lookup, the fingerprint
  // query. Named rather than left as a gap between two numbers that don't add up.
  const overhead = idle !== null && idle > 40
    ? `<div class="lane rest"><span class="who">elsewhere</span>
       <span class="span"><em>request, auth, cache lookup</em></span>
       <span class="ms">${Math.round(idle)}ms</span></div>` : "";

  return `<div class="flow">${rows}${overhead}</div>`;
}

function pipeline(trace, { running = false, seconds = null } = {}) {
  // Measured wall clock for THIS turn, kept with it. The composer readout only
  // exists while a question is in flight.
  const total = seconds === null ? "" :
    `<span class="total">${seconds.toFixed(2)}s total</span>`;

  if (running) {
    return `<div class="pipeline"><span class="stage running">
      <span class="bead"></span>running — the pipeline is replayed once it lands,
      never streamed</span></div>`;
  }
  // A refusal carries no trace at all. Greyed-out stages read as "still loading";
  // say instead that the trace is withheld, which is the actual reason and the same
  // reason the sentence above it is generic.
  if (!(trace && trace.length)) {
    return `<div class="pipeline"><span class="stage withheld">
      <span class="bead"></span>pipeline withheld — its shape names the cause</span>${total}</div>`;
  }
  // A hit runs no graph, so its trace is the one stage that did run. Worth naming:
  // the key includes the caller's live grant set, so this answer was cached by
  // someone with exactly this access — revoke a grant and the entry stops matching.
  if (trace.length === 1 && trace[0].node === "cache") {
    return `<div class="pipeline"><span class="stage on">
      <span class="bead"></span>served from cache<span class="took">${
        Math.round(trace[0].ms)}ms</span></span>
      <span class="cache-why">cached against this caller's live permissions, not just the question</span>${total}</div>`;
  }
  return `<div class="pipeline stack">
    <div class="pipehead"><span class="section">Agents that ran</span>${total}</div>
    ${waterfall(trace, seconds)}</div>`;
}

/* --- asking --------------------------------------------------------------- */
const REFUSAL = "I don't have an answer you're permitted";

function startClock() {
  const began = performance.now();
  // The interval id is local to this closure. It used to live at module scope, so
  // the second question's startClock overwrote it and the first question's stop()
  // cleared the WRONG interval — the original ticked on forever, writing a number
  // that had nothing to do with any request into the one readout on the page. On a
  // screen whose whole claim is "this number is the guarantee", that is the worst
  // possible place for a stale timer.
  let tick = null;
  $("clock").hidden = false;
  $("elapsed").textContent = "0.00";
  tick = setInterval(() => {
    $("elapsed").textContent = ((performance.now() - began) / 1000).toFixed(2);
  }, 60);
  return () => {
    clearInterval(tick);
    const seconds = (performance.now() - began) / 1000;
    // The live readout belongs to the question in flight; once one lands its time
    // is rendered into its own turn, where it stays true.
    $("clock").hidden = true;
    return seconds;
  };
}

// Escape first, then mark the one line worth looking at. Marking before escaping
// would put the tag through esc() and print it.
function highlightAcl(sql) {
  return esc(sql).split("\n").map((line) =>
    line.includes("acl_tags") ? `<span class="acl">${line}</span>` : line).join("\n");
}

function renderAnswer(reply, seconds, { bare = false } = {}) {
  // `bare` is the side-by-side column: the scale above it already carries the
  // timing, and the explanation is stated once under both columns instead of twice.
  const withheld = reply.text.startsWith(REFUSAL);
  // Each citation can show what actually backs it: the passage the wording came
  // from, or the query that counted the rows. Checking beats trusting.
  const sources = reply.citations.length ? `
    <div class="sources">
      <span class="section">Sources</span>
      ${reply.citations.map((c) => {
        const evidence = c.passage || c.query;
        return `
        <div class="source">
          <span class="ref"><span class="plat">${esc(c.source_platform)}:</span>${esc(c.source_ref)}</span>
          <span class="title">${esc(c.title)}</span>
          <span class="actions">
            ${evidence ? `<button class="copy" type="button" data-peek>Show ${
              c.query ? "query" : "passage"}</button>` : ""}
            <button class="copy" type="button" data-ref="${esc(c.source_platform)}:${esc(c.source_ref)}">Copy</button>
          </span>
        </div>
        ${evidence ? `<div class="evidence" hidden>${
          c.query
            ? `<pre>${highlightAcl(c.query)}</pre>
               <p class="why">The highlighted predicate is the access control. It runs
                 inside the query, before ranking and before anything reaches a model —
                 which is why two people asking this get different numbers. Shown with
                 values written in; what ran was the template with every value bound by
                 the driver.</p>`
            : `<p class="passage">${esc(c.passage)}</p>`
        }</div>` : ""}`;
      }).join("")}
    </div>` : "";

  // Timing is content here, not chrome: a refusal held to the deadline is the
  // property that stops the clock from saying what the words won't. Claim it only
  // when the clock agrees — a refusal that ran long escaped, and saying otherwise
  // next to a number that contradicts it discredits the whole guarantee. The upper
  // bound allows for the browser round-trip on top of the server's own padding.
  let held = "";
  if (bare) {
    held = "";
  } else if (withheld && seconds >= 3.9 && seconds <= 4.6) {
    held = `<div class="note"><b>Held to the 4.0s deadline.</b> Every refusal takes the same
      time whatever caused it, so timing this answer tells you nothing the sentence doesn't.
      Unpadded, a permission refusal returns in about 0.9s and an unanswerable one in 4.3s —
      enough to map what restricted material exists without ever seeing it.</div>`;
  } else if (withheld && seconds > 4.6) {
    held = `<div class="note"><b>This refusal ran past the 4.0s deadline.</b> Padding holds a
      refusal until the deadline but cannot pull it back, so a slow one leaks in that single
      direction. <code>evals/refusal_timing.py</code> measures how often: 0% on an idle
      machine. A cold model load or a loaded laptop is the usual cause.</div>`;
  }

  const why = bare || !withheld
    ? ""
    : `<div class="note alert">Every refusal is this same sentence, whether the answer was
         restricted, unsupported or simply missing. The specific reason <b>was</b> recorded,
         and only a compliance officer can read it back — via <code>GET /audit/{request_id}</code>
         or the <a href="/dashboard">gaps dashboard</a>.</div>`;

  return `<div class="answer ${withheld ? "withheld" : ""}">${esc(reply.text)}${sources}</div>${held}${why}`;
}

// One request, measured. Everything below composes this.
async function run(uid, query) {
  const began = performance.now();
  // `as: uid` sends THAT person's token. Nothing here asks on anyone's behalf —
  // showing what two people see means holding two people's tokens.
  const response = await IB.api("/query", {
    method: "POST",
    as: uid,
    body: JSON.stringify({ query }),
  });
  const seconds = (performance.now() - began) / 1000;
  if (!response.ok) {
    const detail = (await response.json().catch(() => ({}))).detail || "";
    throw new Error(`HTTP ${response.status}. ${detail}`);
  }
  return { reply: await response.json(), seconds };
}

const DEADLINE = 4.0;
const SCALE = 8.0;

function scale(seconds, withheld) {
  const pct = Math.min(seconds / SCALE, 1) * 100;
  return `
    <div class="scale ${withheld ? "withheld" : ""}">
      <div class="head">
        <span class="secs">${seconds.toFixed(2)}</span><span class="unit">seconds</span>
        <span class="verdict" style="color:var(--${withheld ? "withheld" : "clear"})">${
          withheld ? "withheld" : "answered"}</span>
      </div>
      <div class="track">
        <div class="fill" style="width:${pct}%"></div>
        <div class="deadline" style="left:${(DEADLINE / SCALE) * 100}%"></div>
      </div>
      <div class="ticks"><span>0s</span><span class="mark">${DEADLINE.toFixed(1)}s deadline</span><span>${SCALE}s</span></div>
    </div>`;
}

function side(uid, result) {
  const withheld = result.reply.text.startsWith(REFUSAL);
  return `
    <div class="side">
      <div class="caller">
        <span class="who">${esc(uid)}</span>
        <span class="role">Caller ${esc(uid)}</span>
        <span class="rule"></span>
      </div>
      ${scale(result.seconds, withheld)}
      ${pipeline(result.reply.trace)}
      ${renderAnswer(result.reply, result.seconds, { bare: true })}
    </div>`;
}

// What the two columns prove, stated rather than left to the reader.
function finding(a, b) {
  const refusedA = a.result.reply.text.startsWith(REFUSAL);
  const refusedB = b.result.reply.text.startsWith(REFUSAL);
  const gap = Math.abs(a.result.seconds - b.result.seconds).toFixed(2);

  if (refusedA !== refusedB) {
    const held = refusedA ? a : b;
    const took = held.result.seconds;
    // Say what the clock says. Claiming the deadline held while the number beside it
    // says otherwise discredits the one property the whole project rests on — the
    // same mistake this page already made once, in renderAnswer.
    const timing = took <= DEADLINE + 0.6
      ? `The refusal took <b>${took.toFixed(2)}s</b>, held to the ${DEADLINE.toFixed(1)}s
         deadline, so its timing says no more than its wording does. Without that padding a
         permission refusal returns in about 0.9s, and timing alone would tell caller
         ${esc(held.uid)} that something exists here.`
      : `The refusal took <b>${took.toFixed(2)}s</b> and so ran <b>past</b> the
         ${DEADLINE.toFixed(1)}s deadline — padding holds a refusal until the deadline but
         cannot pull it back, and that overshoot is the residual leak
         <code>evals/refusal_timing.py</code> measures. It reports 0% on an idle machine; a
         cold model or a loaded laptop is the usual cause.`;
    return `<div class="finding"><span class="lead">One question. Two truths. One clock.</span>
      Caller ${esc(held.uid)} was refused and caller ${esc(refusedA ? b.uid : a.uid)} was answered,
      from the same corpus at the same moment — the filter ran in the database before either
      reached the model. ${timing}</div>`;
  }
  if (refusedA && refusedB) {
    return `<div class="finding"><span class="lead">Both refused, and indistinguishably so.</span>
      Byte-identical text, and ${gap}s between them — both held to the ${DEADLINE.toFixed(1)}s
      deadline. Neither caller can tell whether an answer exists, or whether the other one got it.</div>`;
  }
  return `<div class="finding"><span class="lead">Both answered.</span>
    Nothing here is restricted to either caller, so the permission filter changed nothing —
    which is the common case, and the one a security demo never shows.</div>`;
}

function turn(html, { mine = false } = {}) {
  const node = document.createElement("div");
  node.className = `turn ${mine ? "mine" : ""}`;
  node.innerHTML = html;
  $("thread").append(node);
  node.scrollIntoView({ block: "end", behavior: "smooth" });
  return node;
}

async function ask() {
  const query = $("q").value.trim();
  if (!query) { $("q").focus(); return; }
  const comparing = $("mode-two").getAttribute("aria-selected") === "true";

  $("go").disabled = true;
  $("q").value = "";
  turn(`<div class="bubble">${esc(query)}</div>`, { mine: true });
  const reply = turn(pipeline(null, { running: true }));
  const stop = startClock();

  try {
    if (!comparing) {
      const { reply: body, seconds } = await run(IB.active(), query);
      stop();
      reply.innerHTML = pipeline(body.trace, { seconds }) + renderAnswer(body, seconds);
      return;
    }

    // Sequential, not parallel. One model serves one request at a time, so two in
    // flight would queue and the second column's clock would show the wait rather
    // than the work — and on a screen whose whole point is timing, that is a lie.
    const [uidA, uidB] = IB.signedIn();
    const a = { uid: uidA, result: await run(uidA, query) };
    const b = { uid: uidB, result: await run(uidB, query) };
    stop();
    reply.innerHTML =
      `<div class="compare">${side(uidA, a.result)}${side(uidB, b.result)}</div>` +
      finding(a, b);
  } catch (error) {
    stop();
    reply.innerHTML = `<div class="note alert"><b>${esc(error.message)}</b>
      If the API is unreachable, start it with
      <code>uvicorn src.api.main:app --port 8000</code>.</div>`;
  } finally {
    $("go").disabled = false;
    $("q").focus();
    reply.scrollIntoView({ block: "end", behavior: "smooth" });
  }
}

function describeIdentities() {
  const held = IB.signedIn();
  const comparing = $("mode-two").getAttribute("aria-selected") === "true";
  $("go").textContent = comparing ? "Ask both" : "Ask";
  $("go").disabled = comparing && held.length < 2;
  $("asking").innerHTML = comparing
    ? (held.length >= 2
        ? `as <b>user ${IB.esc(held[0])}</b> and <b>user ${IB.esc(held[1])}</b>`
        : `<span style="color:var(--caution)">Add a second identity to compare —
           you can only show what someone sees if you can sign in as them.</span>`)
    : `as <b>user ${IB.esc(IB.active())}</b>`;
}

for (const [id, on] of [["mode-one", false], ["mode-two", true]]) {
  $(id).addEventListener("click", () => {
    $("mode-one").setAttribute("aria-selected", String(!on));
    $("mode-two").setAttribute("aria-selected", String(on));
    describeIdentities();
  });
}
describeIdentities();

// Keep the thread clear of the sticky composer, whatever height it currently is.
new ResizeObserver(([entry]) => {
  document.documentElement.style.setProperty("--composer-h", `${entry.contentRect.height}px`);
}).observe(document.querySelector(".composer"));

$("form").addEventListener("submit", (e) => { e.preventDefault(); ask(); });
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); ask(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
});
$("thread").addEventListener("click", async (e) => {
  const peek = e.target.closest("[data-peek]");
  if (peek) {
    // The evidence box is the next sibling, NOT an id lookup: every turn in the
    // thread renders citation 0, so an id would open the first turn's passage forever.
    const box = peek.closest(".source").nextElementSibling;
    box.hidden = !box.hidden;
    peek.textContent = box.hidden
      ? peek.textContent.replace("Hide", "Show")
      : peek.textContent.replace("Show", "Hide");
    return;
  }
  const button = e.target.closest(".copy[data-ref]");
  if (!button) return;
  try {
    await navigator.clipboard.writeText(button.dataset.ref);
    button.textContent = "Copied";
    setTimeout(() => { button.textContent = "Copy"; }, 1400);
  } catch (_) {
    const range = document.createRange();
    range.selectNodeContents(button.closest(".source").querySelector(".ref"));
    getSelection().removeAllRanges();
    getSelection().addRange(range);
  }
});
</script>
</body>
</html>
