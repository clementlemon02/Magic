<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sources and grants</title>
<link rel="stylesheet" href="/ui/app.css">
<script src="/ui/app.js"></script>
</head>
<body>

<header class="bar">
  <span class="brand"><span class="dot"></span>Internal Brain <small>Aurelia</small></span>
  <nav>
    <a href="/">Ask</a>
    <a href="/dashboard" data-officer="1">Gaps</a>
    <a href="/audit" data-officer="1">Audit</a>
    <a href="/sources" data-officer="1" aria-current="page">Sources</a>
  </nav>
  <span class="spacer"></span>
  <button class="icon-button" id="theme" type="button" aria-label="Switch theme" title="Switch theme">◐</button>
</header>

<main class="page wide">
  <h1>Sources and grants</h1>
  <p class="lede">One workspace authorization per source, run by IT. Nobody else connects
    anything — the same connection reads the content and the permission model that decides
    who may see it.</p>

  <div class="panel" style="margin-bottom:22px">
    <div class="controls">
      <div>
        <label class="label" for="subject">Grants for user</label>
        <input id="subject" type="number" min="1" value="2" inputmode="numeric">
      </div>
      <button id="go" type="button">Load</button>
    </div>
  </div>

  <div class="split">
    <div class="detail" id="sources"></div>
    <p id="grant-error" class="signin-error"></p>
    <div class="worklist" id="grants" style="width:420px"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
// Nothing below runs until somebody is signed in.
if (!IB.start()) { throw new Error("signed out"); }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));


const forbidden = () => `<div class="note alert"><b>This page is for a compliance officer.</b> Connecting a source and changing who may read it are officer actions. You are signed in as user ${esc(IB.active())}, who is not one —
  pick that identity in the header, or <b>Add identity</b> if you are not holding it
  yet. Adding one never switches you on its own.</div>`;

const ago = (iso) => {
  if (!iso) return "never";
  const minutes = Math.round((Date.now() - new Date(iso)) / 60000);
  if (minutes < 1) return "just now";
  if (minutes < 60) return `${minutes} min ago`;
  const hours = Math.round(minutes / 60);
  return hours < 48 ? `${hours}h ago` : `${Math.round(hours / 24)} days ago`;
};

// What the last "Sync now" did, kept here because loadSources() redraws the whole column.
let syncNote = "";

const summarize = (r) => {
  if (r.error) return `${r.platform}: failed`;
  if (r.skipped) return `${r.platform}: already running`;
  const parts = [
    r.added && `${r.added} added`, r.updated && `${r.updated} updated`,
    r.removed && `${r.removed} removed`,
    r.grants_revoked && `${r.grants_revoked} grants revoked`,
    r.grants_added && `${r.grants_added} grants added`,
  ].filter(Boolean);
  return `${r.platform}: ${parts.length ? parts.join(", ") : "nothing changed"}`;
};

async function loadSources() {
  $("sources").innerHTML = `<div class="note">Loading…</div>`;
  const response = await IB.api("/admin/sources", {}).catch(() => null);
  if (!response) { $("sources").innerHTML = `<div class="note alert"><b>Cannot reach the API.</b></div>`; return; }
  if (response.status === 403) { $("sources").innerHTML = forbidden(); return; }
  const sources = await response.json();
  // Stale is a judgement about freshness, so it is drawn, not just stated: the
  // permissions table is a mirror of each source's ACLs and only as fresh as its last
  // sync. The server decides (twice the sync interval), because only it knows the interval.
  $("sources").innerHTML = `
    <div class="panel" style="margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <button id="sync" type="button">Sync now</button>
      <span id="sync-note" role="status" style="font-size:12.5px;color:var(--muted)">${esc(syncNote) ||
        "Re-reads every source and brings the mirror in line: edits, deletions and permission changes."}</span>
    </div>` + sources.map((s) => `
    <div class="panel" style="margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <span style="display:grid;place-items:center;width:34px;height:34px;border-radius:8px;
          background:var(--raised);font:500 13px var(--mono)">${esc(s.platform[0].toUpperCase())}</span>
        <div style="flex-grow:1;min-width:0">
          <div style="font-size:15.5px;font-weight:500;text-transform:capitalize">${esc(s.platform)}</div>
          <div style="font:400 12px var(--mono);color:var(--muted);margin-top:3px">
            ${s.documents} documents · ${s.chunks} chunks · ${s.grants} grants</div>
        </div>
        ${s.restricted ? `<span class="tag restricted">${s.restricted} restricted</span>` : ""}
        <span class="tag ${s.stale || s.last_error ? "" : "clear"}"
          style="${s.stale || s.last_error ? "color:var(--caution)" : ""}">
          ${s.last_error ? "sync failing" : s.stale ? "stale" : "connected"}</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px;margin-top:12px;padding-top:11px;
        border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);flex-wrap:wrap">
        <span>${s.last_synced ? `${s.last_error ? "Last good sync" : "Synced"} ${esc(ago(s.last_synced))}`
          : `Never synced — documents loaded ${esc(ago(s.last_ingested))}`}</span>
        <span class="spacer" style="margin-left:auto"></span>
        <span style="font-family:var(--mono);font-size:11.5px">python -m scripts.sync_sources</span>
      </div>
      ${s.last_error ? `<p class="signin-error" style="margin:10px 0 0">The last attempt failed:
        ${esc(s.last_error)}. Nothing was changed; the mirror is as the last good sync left it.</p>` : ""}
    </div>`).join("") + `
    <div class="note">Restricted documents are re-checked against the source at question
      time, so a revocation upstream takes effect before the next answer. Everything else
      rides on this mirror, which each sync brings back in line with the source: edits,
      deletions and permission changes.</div>`;
}

$("sources").addEventListener("click", async (e) => {
  const button = e.target.closest("#sync");
  if (!button) return;
  button.disabled = true;
  button.textContent = "Syncing…";
  const response = await IB.api("/admin/sync", { method: "POST", headers: {} }).catch(() => null);
  if (!response || !response.ok) {
    // Say so, and say nothing changed: a sync that failed silently would leave an officer
    // believing the mirror had caught up with an edit it had not.
    const detail = response ? (await response.json().catch(() => ({}))).detail : "";
    syncNote = `The sync did not run${detail ? `: ${detail}` : " — the server did not respond."}`;
  } else {
    syncNote = (await response.json()).map(summarize).join(" · ");
  }
  // Re-read rather than patch: the tables are the truth, and grants may have moved too.
  await loadSources();
  loadGrants();
});

async function loadGrants() {
  $("grants").innerHTML = `<div class="note">Loading…</div>`;
  const subject = $("subject").value;
  const response = await IB.api(`/admin/permissions?user_id=${encodeURIComponent(subject)}`,
    {}).catch(() => null);
  if (!response) { $("grants").innerHTML = `<div class="note alert"><b>Cannot reach the API.</b></div>`; return; }
  if (response.status === 403) { $("grants").innerHTML = forbidden(); return; }
  const grants = await response.json();
  if (!grants.length) {
    $("grants").innerHTML = `<div class="note">User ${esc(subject)} has no individual
      grants, live or revoked. They may still reach documents through their role — a
      grant is an exception on top of that, not the whole of what someone can see.</div>`;
    return;
  }
  $("grants").innerHTML = `
    <div class="panel">
      <span class="section">Grants · user ${esc(subject)}</span>
      <p style="margin:0 0 14px;font-size:13px;line-height:1.55;color:var(--muted)">
        Revoking takes effect on the next question: retrieval joins this table, and the
        answer cache is keyed on the grant set.</p>
      ${grants.map((g) => {
        // A revoked row stays, greyed, offering itself back. It used to disappear,
        // which left the page's own grant path unreachable and a misclick permanent
        // as far as this screen was concerned.
        const live = !g.revoked_at;
        return `
        <div class="source${live ? "" : " gone"}">
          <span class="ref"><span class="plat">${esc(g.source_platform)}:</span>${esc(g.source_ref)}</span>
          ${g.sensitivity === "restricted" ? '<span class="tag restricted">restricted</span>' : ""}
          ${live ? "" : '<span class="tag">revoked</span>'}
          <button class="copy" type="button" style="color:var(--${live ? "withheld" : "clear"})"
            data-platform="${esc(g.source_platform)}" data-ref="${esc(g.source_ref)}"
            data-action="${live ? "revoke" : "grant"}">${live ? "Revoke" : "Grant"}</button>
        </div>`;
      }).join("")}
    </div>`;
}

// Two clicks, in the button itself. Changing who may read something is the one
// action on this screen with a consequence outside it, and it used to happen on a
// single click with no way back but noticing. Not window.confirm(): embedded views
// return from it immediately without ever showing a dialog, so the guard would be
// no guard at all in exactly the places it is hardest to notice.
let armed = null;
function disarm() {
  if (!armed) return;
  armed.textContent = armed.dataset.action === "revoke" ? "Revoke" : "Grant";
  armed.classList.remove("armed");
  armed = null;
}
document.addEventListener("click", (e) => {
  if (armed && !e.target.closest("button[data-action]")) disarm();
});

$("grants").addEventListener("click", async (e) => {
  const button = e.target.closest("button[data-action]");
  if (!button) return;
  const revoking = button.dataset.action === "revoke";
  if (armed !== button) {
    disarm();
    armed = button;
    button.textContent = revoking ? "Revoke — confirm" : "Grant — confirm";
    button.classList.add("armed");
    return;
  }
  armed = null;
  button.classList.remove("armed");
  button.disabled = true;
  button.textContent = revoking ? "Revoking…" : "Granting…";
  const response = await IB.api(`/admin/permissions/${revoking ? "revoke" : "grant"}`, {
    method: "POST",
    headers: {},
    body: JSON.stringify({
      user_id: Number($("subject").value),
      source_platform: button.dataset.platform,
      source_ref: button.dataset.ref,
    }),
  }).catch(() => null);
  if (!response || !response.ok) {
    // Say so. This used to reset the button and stop, leaving the officer with no
    // way to tell a failed revoke from a completed one — the single worst state for
    // a screen whose subject is who can read what.
    button.disabled = false;
    button.textContent = revoking ? "Revoke" : "Grant";
    const detail = response ? (await response.json().catch(() => ({}))).detail : "";
    $("grant-error").textContent =
      `That ${revoking ? "revoke" : "grant"} did not go through${
        detail ? `: ${detail}` : " — the server did not respond."} Nothing changed.`;
    return;
  }
  $("grant-error").textContent = "";
  // Re-read rather than patch the row: the table is the truth, and the whole point
  // of this screen is that the next question reads the same table.
  loadGrants();
  loadSources();
});

function load() { loadSources(); loadGrants(); }
$("go").addEventListener("click", load);
for (const id of ["subject"]) {
  $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });
}
load();
</script>
</body>
</html>
