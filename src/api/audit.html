<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit trail</title>
<link rel="stylesheet" href="/ui/app.css">
<script src="/ui/app.js"></script>
</head>
<body>

<header class="bar">
  <span class="brand"><span class="dot"></span>Internal Brain <small>Aurelia</small></span>
  <nav>
    <a href="/">Ask</a>
    <a href="/dashboard" data-officer="1">Gaps</a>
    <a href="/audit" data-officer="1" aria-current="page">Audit</a>
    <a href="/sources" data-officer="1">Sources</a>
  </nav>
  <span class="spacer"></span>
  <button class="icon-button" id="theme" type="button" aria-label="Switch theme" title="Switch theme">◐</button>
</header>

<main class="page wide">
  <h1>Audit trail</h1>
  <p class="lede">Every request, hash-chained. Opening one reads its explanation back — the only
    path that can, and itself recorded.</p>

  <div class="panel" style="margin-bottom:22px">
    <div class="controls">
      <div>
        <label class="label" for="days">Days</label>
        <input id="days" type="number" min="1" value="7" inputmode="numeric">
      </div>
      <button id="go" type="button">Refresh</button>
      <button class="ghost" id="verify" type="button">Verify chain</button>
      <div class="mode" role="tablist" aria-label="Show which requests">
        <button id="f-all" type="button" role="tab" aria-selected="true" data-outcome="all">All</button>
        <button id="f-refused" type="button" role="tab" aria-selected="false" data-outcome="refused">Refused</button>
        <button id="f-answered" type="button" role="tab" aria-selected="false" data-outcome="answered">Answered</button>
        <button id="f-declined" type="button" role="tab" aria-selected="false" data-outcome="declined">Out of scope</button>
      </div>
      <input id="search" type="search" placeholder="Search the question…" style="width:210px"
        autocomplete="off" spellcheck="false">
      <div class="spacer" style="margin-left:auto"></div>
      <div class="readout" id="count" hidden>
        <span class="big" id="count-n">0</span><span class="unit" id="count-unit">requests</span>
      </div>
    </div>
  </div>

  <div id="chain"></div>

  <div class="split">
    <div class="worklist" id="list"></div>
    <div class="detail" id="detail"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
// Nothing below runs until somebody is signed in.
if (!IB.start()) { throw new Error("signed out"); }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));


let requests = [];
// Must match the API's own default (audit.recent_requests).
const PAGE_LIMIT = 100;
let current = null;

const forbidden = () => `<div class="note alert"><b>This page is for a compliance officer.</b> A request id is the key to an explanation, so browsing them is officer-only. You are signed in as user ${esc(IB.active())}, who is not one —
  pick that identity in the header, or <b>Add identity</b> if you are not holding it
  yet. Adding one never switches you on its own.</div>`;

// Which events carry a verdict worth colouring. Everything else is process.
const TONE = { escalation: "bad", permission_conflict: "bad", source_recheck_denied: "bad",
               final_answer: "good", draft_answer: "good" };

function renderList() {
  if (!requests.length && (outcome() !== "all" || $("search").value.trim())) {
    return `<div class="note">Nothing matches that filter in the last
      ${esc($("days").value)} days. <b>All</b> puts everything back.</div>`;
  }
  if (!requests.length) {
    return `<div class="note">No requests in this window. Ask something on the
      <a href="/">Ask</a> page and it will appear here.</div>`;
  }
  return requests.map((r) => `
    <button class="request" type="button" data-id="${esc(r.request_id)}"
      aria-current="${r.request_id === current}">
      <div class="q">${esc(r.query) || "(no question recorded)"}</div>
      <div class="meta">
        <span>user ${esc(r.user_id ?? "?")}</span>
        <span>${esc(r.route ?? "—")}</span>
        <span class="tag ${r.escalated ? "restricted" : "clear"}">${
          r.escalated ? esc(r.reason || "refused")
                      : r.route === "decline" ? "out of scope" : "answered"}</span>
        <span style="margin-left:auto">${esc(new Date(r.at).toLocaleTimeString())}</span>
      </div>
    </button>`).join("");
}

function renderDetail(report) {
  const events = report.events.map((e, i) => {
    const payload = JSON.stringify(e.payload, null, 1);
    const last = i === report.events.length - 1;
    return `<div class="event">
      <div class="rail">
        <span class="dot ${TONE[e.event_type] || ""}"></span>
        ${last ? "" : '<span class="line"></span>'}
      </div>
      <div class="body">
        <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
          <span class="type">${esc(e.event_type)}</span>
          <span style="margin-left:auto;font:400 11.5px var(--mono);color:var(--muted)">${
            esc(new Date(e.occurred_at).toLocaleTimeString())}</span>
        </div>
        <pre>${esc(payload.length > 420 ? payload.slice(0, 420) + "\\n…" : payload)}</pre>
      </div>
    </div>`;
  }).join("");

  const explanation = report.explanation
    ? `<div class="warded" style="margin-bottom:18px">
         <span class="label">Never sent to the asker</span>
         <p style="margin:0;font-size:14.5px;line-height:1.6">${esc(report.explanation)}</p>
         <p style="margin:12px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55">
           Reading this is itself on the record — a <span style="font-family:var(--mono)">compliance_inquiry</span>
           row was appended when you opened it.</p>
       </div>`
    : `<div class="note" style="margin-bottom:18px">This request was answered. There is no
         withheld explanation to read.</div>`;

  const conflicts = report.permission_conflicts.length
    ? `<div class="panel" style="margin-bottom:18px">
         <span class="section">Withheld items</span>
         ${report.permission_conflicts.map((c) => `
           <div class="source">
             <span class="ref"><span class="plat">${esc(c.source_platform)}:</span>${esc(c.source_ref)}</span>
             <span class="tag restricted">${esc(c.sensitivity)}</span>
             <span style="margin-left:auto;font:400 12px var(--mono);color:var(--withheld)">+${
               c.score_margin.toFixed(2)}</span>
           </div>`).join("")}
       </div>`
    : "";

  return explanation + conflicts + events;
}

/* Filtering happens in SQL, not here. 306 requests over seven days against a
   hundred-row window: narrowing what the page had already fetched would report
   "12 refusals" when the window held 12 of 122 — the same lie as the count that
   used to read "100 requests". So every change refetches. */
function outcome() {
  const on = document.querySelector('.mode [aria-selected="true"]');
  return on ? on.dataset.outcome : "all";
}

async function loadList() {
  $("list").innerHTML = `<div class="note">Loading…</div>`;
  $("count").hidden = true;
  const where = new URLSearchParams({
    days: $("days").value,
    outcome: outcome(),
    q: $("search").value.trim(),
  });
  const response = await IB.api(`/audit/recent?${where}`, {}).catch(() => null);
  if (!response) {
    $("list").innerHTML = `<div class="note alert"><b>Cannot reach the API.</b></div>`;
    return;
  }
  if (response.status === 403) { $("list").innerHTML = forbidden(); $("detail").innerHTML = ""; return; }
  requests = await response.json();
  // The API returns at most PAGE_LIMIT rows. Saying "100 requests" when the real
  // figure is unknown-and-larger is a wrong number in the one surface whose entire
  // claim is that it reports what happened.
  const capped = requests.length >= PAGE_LIMIT;
  const narrowed = outcome() !== "all" || $("search").value.trim();
  $("count-n").textContent = capped ? `${PAGE_LIMIT}+` : requests.length;
  $("count-unit").textContent = capped
    ? "newest shown"
    : narrowed ? "matching" : "requests";
  $("count").hidden = false;
  $("list").innerHTML = renderList();
  $("detail").innerHTML = requests.length
    ? `<div class="note">Pick a request to read its trail.</div>` : "";
}

async function loadDetail(id) {
  current = id;
  $("list").innerHTML = renderList();
  $("detail").innerHTML = `<div class="note">Loading…</div>`;
  const response = await IB.api(`/audit/${encodeURIComponent(id)}`, {})
    .catch(() => null);
  if (!response) { $("detail").innerHTML = `<div class="note alert"><b>Cannot reach the API.</b></div>`; return; }
  if (response.status === 403) { $("detail").innerHTML = forbidden(); return; }
  if (!response.ok) {
    $("detail").innerHTML = `<div class="note alert"><b>HTTP ${response.status}</b></div>`;
    return;
  }
  $("detail").innerHTML = renderDetail(await response.json());
}

async function verifyChain() {
  $("chain").innerHTML = `<div class="note">Walking the chain…</div>`;
  const response = await IB.api("/audit/verify", {}).catch(() => null);
  if (!response) { $("chain").innerHTML = `<div class="note alert"><b>Cannot reach the API.</b></div>`; return; }
  if (response.status === 403) { $("chain").innerHTML = forbidden(); return; }
  const report = await response.json();
  $("chain").innerHTML = report.ok
    ? `<div class="banner ok"><b>Chain verified.</b> No row has been altered.
         <span class="mono">${report.rows_checked} rows walked</span></div>`
    : `<div class="banner bad"><b>Chain broken at row ${report.first_bad_id}.</b>
         ${esc(report.problem || "")}
         <span class="mono">${report.rows_checked} rows walked</span></div>`;
}

$("list").addEventListener("click", (e) => {
  const button = e.target.closest(".request");
  if (!button) return;
  loadDetail(button.dataset.id);
  // Stacked layout only: the detail sits BELOW a hundred rows there, so picking one
  // would otherwise load a trail you cannot see without scrolling past the whole
  // list. Side by side the two panes are pinned and both are already in view, and
  // scrolling then would just twitch the page for no reason.
  if (window.matchMedia("(max-width: 820px)").matches) {
    $("detail").scrollIntoView({ block: "start", behavior: "smooth" });
  }
});
$("go").addEventListener("click", loadList);

document.querySelector(".mode").addEventListener("click", (e) => {
  const tab = e.target.closest("[data-outcome]");
  if (!tab) return;
  for (const other of document.querySelectorAll(".mode [data-outcome]")) {
    other.setAttribute("aria-selected", String(other === tab));
  }
  loadList();
});

// Debounced: each keystroke is a query against the audit table, and holding one
// key down should not be a hundred of them.
let typing = null;
$("search").addEventListener("input", () => {
  clearTimeout(typing);
  typing = setTimeout(loadList, 250);
});
$("verify").addEventListener("click", verifyChain);
for (const id of ["days"]) {
  $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") loadList(); });
}
loadList();
</script>
</body>
</html>
